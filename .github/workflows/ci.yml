# Continuous integration (concept 6.10, T03-T11, T31). No Azure sign-in, no secrets, no deployment.
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PSRULE_VERSION: "2.9.0"
  PSRULE_AZURE_VERSION: "1.39.0"

jobs:
  lint:
    name: Lint (ruff, shell, PowerShell)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff (pinned)
        run: python -m pip install ruff==0.6.9
      - name: Ruff (findings also appear as annotations on the run summary page)
        run: ruff check --output-format=github .
      - name: Shell scripts (bash -n and ShellCheck)
        run: |
          for file in scripts/*.sh scripts/lib/*.sh; do bash -n "$file"; done
          sh -n docker/entrypoint.sh
          shellcheck -x --source-path=SCRIPTDIR --severity=warning scripts/*.sh scripts/lib/*.sh docker/entrypoint.sh
      - name: PowerShell scripts (parser check)
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Path scripts -Recurse -Filter *.ps1) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in $parseErrors) {
              Write-Host "::error file=$($file.FullName),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

  tests:
    name: Tests (unit, golden, authz, safety, UI DOM) and golden run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      APP_ENV: local
      AGENT_BACKEND: offline
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Standard-library tests (nothing installed)
        run: python -m unittest discover -s tests -t . -v
      - name: Golden run (offline, 100 % match required)
        run: |
          mkdir -p artifacts
          python -m pms golden --out artifacts/golden-summary.json
      - name: Upload golden summary
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golden-summary
          path: artifacts/golden-summary.json
          if-no-files-found: warn

  ui-playwright:
    name: UI tests in a browser (Playwright, screenshots)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: tests
    env:
      PYTHONPATH: src
      APP_ENV: local
      AGENT_BACKEND: offline
      LOCAL_TEST_USERS: "true"
      WORKER_MODE: inprocess
      PMS_BASE_URL: http://127.0.0.1:8000
      SCREENSHOT_DIR: artifacts/screenshots
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the pinned requirements (also proves the Azure pins resolve)
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: Start the offline demo
        run: |
          mkdir -p artifacts/screenshots
          export DATA_DIR="$RUNNER_TEMP/pms-var"
          nohup python -m pms serve --seed --host 127.0.0.1 --port 8000 > artifacts/server.log 2>&1 &
          python - <<'EOF'
          import sys
          import time
          import urllib.request

          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=2) as response:
                      if response.status == 200:
                          sys.exit(0)
              except OSError:
                  pass
              time.sleep(1)
          sys.exit("The offline demo did not answer /healthz within 60 seconds.")
          EOF
      - name: Playwright UI tests
        run: |
          test -d tests/ui/playwright || { echo "::error::tests/ui/playwright is missing"; exit 1; }
          python -m pytest tests/ui/playwright -v
      - name: Upload screenshots and server log
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ui-screenshots
          path: |
            artifacts/screenshots
            artifacts/server.log
          if-no-files-found: warn

  bicep:
    name: Bicep build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
      - name: Install the Bicep CLI
        run: |
          az bicep install
          az bicep version
      - name: Build infra/main.bicep (restores the Microsoft Graph extension) and the PSRule test entry
        run: |
          mkdir -p artifacts
          az bicep build --file infra/main.bicep --outfile artifacts/main.json
          az bicep build --file infra/tests/main.tests.bicep --outfile artifacts/main.tests.json
      - name: Upload compiled templates
        uses: actions/upload-artifact@v7.0.2
        with:
          name: arm-templates
          path: artifacts/*.json

  psrule:
    name: Well-Architected check (PSRule for Azure)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
      - name: Install the Bicep CLI (PSRule expands the Bicep files with it)
        run: |
          az bicep install
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"
      - name: Install PSRule modules (pinned versions)
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSRule -RequiredVersion $env:PSRULE_VERSION -Scope CurrentUser -Force
          Install-Module -Name PSRule.Rules.Azure -RequiredVersion $env:PSRULE_AZURE_VERSION -Scope CurrentUser -Force
      - name: Assert-PSRule (WAF rules; suppressions with written reasons in .ps-rule/)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # -Path loads the suppression groups; with -Module alone the working directory is not read.
          Assert-PSRule -Option ./ps-rule.yaml -Path ./.ps-rule/ -InputPath ./infra/tests/ -Module PSRule.Rules.Azure -Format File -OutputFormat Sarif -OutputPath artifacts/ps-rule.sarif
      - name: List every PSRule finding on the run summary page (the annotations show only the first 10)
        if: failure()
        shell: pwsh
        run: |
          $results = @(Invoke-PSRule -Option ./ps-rule.yaml -Path ./.ps-rule/ -InputPath ./infra/tests/ -Module PSRule.Rules.Azure -Format File -Outcome Fail, Error -WarningAction SilentlyContinue)
          $lines = [System.Collections.Generic.List[string]]::new()
          $lines.Add("### PSRule for Azure: $($results.Count) failed or errored results (complete list)")
          $lines.Add('')
          $lines.Add('| Rule | Target | Type | Reason |')
          $lines.Add('| --- | --- | --- | --- |')
          foreach ($result in $results) {
            $reason = ((@($result.Reason) -join '; ') -replace '\|', '/') -replace '\r?\n', ' '
            $lines.Add("| $($result.RuleName) | $($result.TargetName) | $($result.TargetType) | $reason |")
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload the PSRule report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: psrule-report
          path: artifacts/ps-rule.sarif
          if-no-files-found: warn

  hygiene:
    name: Secret scan and workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Secret scan (standard library)
        run: |
          python scripts/secret_scan.py --self-test
          python scripts/secret_scan.py
      - name: Validate workflows and azure.yaml (built-in parser, then PyYAML)
        run: |
          python scripts/validate_workflows.py --no-pyyaml
          python -m pip install PyYAML==6.0.3
          python scripts/validate_workflows.py
      - name: Resolve all pinned packages (pip --dry-run; a missing version fails here, also when tests fail)
        run: python -m pip install --dry-run --ignore-installed -r requirements-dev.txt
